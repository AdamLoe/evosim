<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>evosim</title>
    <!-- COI service-worker shim: enables SharedArrayBuffer on hosts that
         can't set COOP/COEP response headers (e.g. GitHub Pages). On hosts
         that already serve the right headers (Vite dev, Cloudflare Pages
         via _headers) the shim is a no-op. Must run before any module
         script that touches SAB. -->
    <script src="/coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Default state: rail is collapsed (matches Settings.railOpen=false
         default). JS removes the class on boot iff the persisted setting
         says otherwise — avoids a one-frame flash of the rail-open layout
         on fresh loads while CSS is still applying. -->
    <div id="app-shell" class="rail-collapsed">
      <!-- Left column: top-bar + canvas. The profiler bottom panel (perf-box)
           is kept in the DOM as an empty placeholder so the resize-handle
           logic and any legacy references stay intact; the profiler content
           is now rendered inside the top-level Profiler rail tab. -->
      <div id="left-col">
        <!-- Top-bar controls: play/pause, Restart, and the hamburger rail
             toggle. Auto-restart and the saved-world actions live in the General
             rail tab; NN / Inspector / perf-toggle openers removed earlier. -->
        <div id="top-bar">
        </div>

        <div id="canvas-wrap">
          <canvas id="aquarium"></canvas>
          <!-- v1.13 Wave 3: drag handle for the bottom profiler panel.
               Hidden when #perf-box is display:none. -->
          <div id="perf-resize-handle" aria-hidden="true"></div>
        </div>

        <!-- #perf-box is kept as an empty hidden placeholder. Profiler
             content now lives in #settings-profiler-pane inside the Profiler
             rail tab. The resize handle and legacy e2e refs still find this element. -->
        <div id="perf-box" class="perf-widget" style="display:none"></div>
      </div>

      <!-- Right rail: General | Inspector | Settings | Profiler. NN remains
           folded into Settings; Inspector stays click-to-open. -->
      <aside id="right-rail">
        <!-- v1.13 Wave 3: drag handle for the right rail width. -->
        <div id="rail-resize-handle" aria-hidden="true"></div>
        <nav id="rail-tabs" role="tablist">
          <button data-tab="general" class="rail-tab is-active" title="General" aria-label="General">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 6h16"></path>
              <path d="M4 12h16"></path>
              <path d="M4 18h16"></path>
            </svg>
            <span class="rail-tab-label">General</span>
          </button>
          <button data-tab="inspector" class="rail-tab" title="Inspector" aria-label="Inspector">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-5-5"></path>
            </svg>
            <span class="rail-tab-label">Inspector</span>
          </button>
          <button data-tab="settings" class="rail-tab" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
            <span class="rail-tab-label">Settings</span>
          </button>
          <button data-tab="profiler" class="rail-tab" title="Profiler" aria-label="Profiler">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M4 19V5"></path>
              <path d="M8 19v-8"></path>
              <path d="M12 19V8"></path>
              <path d="M16 19v-5"></path>
              <path d="M20 19V4"></path>
            </svg>
            <span class="rail-tab-label">Profiler</span>
          </button>
        </nav>

        <!-- Settings tab: left sub-nav categories + right category pane +
             Apply / Cancel / Reset footer. -->
        <section id="rail-settings" class="rail-panel">
          <!-- Settings inner: sub-nav on the left, active category pane on right. -->
          <div id="settings-inner">
            <!-- Left vertical category sub-nav -->
            <nav id="settings-subnav" aria-label="Settings categories">
              <button class="settings-cat-btn is-active" data-cat="energy">Energy</button>
              <button class="settings-cat-btn" data-cat="grass">Grass</button>
              <button class="settings-cat-btn" data-cat="lifecycle">Lifecycle</button>
              <button class="settings-cat-btn" data-cat="world">World</button>
              <button class="settings-cat-btn" data-cat="display">Display</button>
              <button class="settings-cat-btn" data-cat="nn">NN</button>
            </nav>
            <!-- Right category pane area: only the is-active pane is visible -->
            <div id="settings-panes">
              <!-- Energy: upkeep, move cost, energy max, attack, digestion -->
              <div id="settings-energy-pane" class="settings-pane is-active">
                <div id="devpanel-energy"></div>
              </div>
              <!-- Grass: grass sim settings, grass rendering/display settings -->
              <div id="settings-grass-pane" class="settings-pane">
                <div id="devpanel-grass"></div>
              </div>
              <!-- Lifecycle: ages, splits, founders, mutations, species/mating -->
              <div id="settings-lifecycle-pane" class="settings-pane">
                <div id="devpanel-lifecycle"></div>
              </div>
              <!-- World: world shape, size, seed, wrap, LOD -->
              <div id="settings-world-pane" class="settings-pane">
                <div id="devpanel-world"></div>
              </div>
              <!-- Display: grass visuals, theme, render/LOD -->
              <div id="settings-display-pane" class="settings-pane">
                <div id="devpanel-display"></div>
              </div>
              <!-- NN: topology + mutation-bucket editors (folded from rail-nn tab).
                   Stable mount point for installNnTab. -->
              <div id="settings-nn-pane" class="settings-pane">
                <div id="nn-tab-host"></div>
              </div>
            </div>
          </div>
          <div id="settings-footer">
            <button id="settings-apply" type="button" disabled>Apply</button>
            <button id="settings-cancel" type="button" disabled>Cancel</button>
            <button id="settings-reset" type="button">Reset</button>
          </div>
        </section>

        <!-- #rail-nn is no longer a top-level tab. NN editor is now in
             the Settings rail's "NN" category pane (#settings-nn-pane above).
             The inspector stays click-to-open (creature click). -->

        <!-- Inspector tab: empty-state hint by default; populated when the
             user clicks a creature on the canvas. -->
        <section id="rail-inspector" class="rail-panel">
          <div id="inspector-empty" class="rail-empty">Waiting for creature to be clicked.</div>
          <div id="inspector-body" style="display:none">
            <dl>
              <dt>ID</dt><dd id="ins-id"></dd>
              <dt>Pos</dt><dd id="ins-pos"></dd>
              <dt>Action</dt><dd id="ins-action"></dd>
              <dt>Age</dt><dd id="ins-age"></dd>
              <dt>Energy</dt><dd id="ins-energy"></dd>
              <dt>Cooldown</dt><dd id="ins-cooldown">—</dd>
              <dt>Color</dt><dd>
                <span id="ins-color-swatch" class="ema-swatch"></span>
                <span id="ins-hue">—</span>
              </dd>
            </dl>
            <!-- v2.0 Wave 3b: species panel — shown only when the inspected
                 creature carries species data (species mode). -->
            <div id="ins-species-block" style="display:none">
              <div class="ins-section-title">Species</div>
              <dl>
                <dt>Species</dt><dd>
                  <span id="ins-species-swatch" class="ema-swatch"></span>
                  <span id="ins-species-name">—</span>
                  <span id="ins-species-id" class="ins-species-id-tag">—</span>
                </dd>
                <dt>History</dt><dd id="ins-species-history" class="ins-species-history">—</dd>
              </dl>
            </div>
            <dl>
              <dt>Walls (N/S/E/W)</dt><dd id="ins-walls">—</dd>
              <dt>Recent</dt><dd id="ins-history">—</dd>
              <dt>NN weights</dt><dd id="ins-nn-count">—</dd>
            </dl>
            <!-- NN I/O block — rendered from creature_nn_inspect_json. -->
            <div id="ins-nn-block" style="display:none">
              <div class="ins-section-title">NN Inputs</div>
              <div id="ins-nn-inputs"></div>
              <div class="ins-section-title">NN Outputs</div>
              <dl id="ins-nn-outputs">
                <dt>vx / vy</dt><dd id="ins-nn-vxvy">—</dd>
                <dt>Graze</dt><dd><span class="nn-out-bar"><span id="ins-nn-logit-graze-fill" class="nn-out-bar-fill"></span></span><span id="ins-nn-logit-graze-v" class="trait-val">—</span></dd>
                <dt>Attack</dt><dd><span class="nn-out-bar"><span id="ins-nn-logit-attack-fill" class="nn-out-bar-fill"></span></span><span id="ins-nn-logit-attack-v" class="trait-val">—</span></dd>
                <dt>Split/Mate</dt><dd><span class="nn-out-bar"><span id="ins-nn-logit-split-fill" class="nn-out-bar-fill"></span></span><span id="ins-nn-logit-split-v" class="trait-val">—</span></dd>
                <dt>Chosen</dt><dd id="ins-nn-chosen" class="ins-nn-chosen">—</dd>
              </dl>
            </div>
          </div>
        </section>

        <!-- General tab: game options relocated off the top bar — run control
             (auto-restart) and the saved-world actions (Save / Resume / Fork /
             Export / Import) plus the save-status line. Populated by
             installMenuTab. -->
        <section id="rail-general" class="rail-panel is-active">
          <div id="menu-inner"></div>
        </section>
        <section id="rail-profiler" class="rail-panel">
          <div id="settings-profiler-pane">
            <!-- installProfilerPanel mounts here -->
          </div>
        </section>
      </aside>
    </div>

    <!-- Toast host for transient notifications (construction-only-changes,
         etc.). Pinned to the bottom-center of the viewport. -->
    <div id="toast-host"></div>

    <!-- World-end overlay: shown when the last creature dies. -->
    <div id="world-end-overlay" hidden>
      <div class="world-end-card">
        <h2>World ended</h2>
        <p>The last creature has died.</p>
        <div class="world-end-actions">
          <button id="world-end-restart" type="button">Restart world</button>
          <button id="world-end-dismiss" type="button">Keep watching</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
