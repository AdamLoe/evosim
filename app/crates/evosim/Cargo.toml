[package]
name = "evosim"
version = "0.1.0"
edition = "2021"
description = "Browser-deployed idle evolution sandbox (Rust -> wasm)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Codegen binary: emits TS mirror of slider names + control SAB layout to
# `src/web/src/generated/` (i.e. `../../web/src/generated/` from this crate).
# Run `cargo run --bin gen-bindings` after modifying `SLIDER_NAMES` or
# `control_sab.rs`. A drift unit test catches mismatches.
[[bin]]
name = "gen-bindings"
path = "src/bin/gen_bindings.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wide = "0.7"
rand_xoshiro = { version = "0.6", features = ["serde1"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Performance",
]

# wasm-bindgen-rayon is optional, behind feature flag (requires COOP/COEP + SAB).
# v1: ship without rayon by default; enable via feature when ready.
[features]
default = []
threads = ["wasm-bindgen-rayon", "rayon"]

[dependencies.wasm-bindgen-rayon]
version = "1.3"
optional = true

[dependencies.rayon]
version = "1.10"
optional = true

# Native criterion benchmark: grass scatter vs blur propagation speedup.
# criterion = "0.5" is the last stable release and does not require nightly.
# NOTE: wasm-bindgen / web-sys are NOT dev-deps — grass.rs compiles fine on
# native x86_64 (the wasm-bindgen usage in grass.rs is zero; the profiler's
# wasm32 branches are gated by cfg(target_arch)).
[dev-dependencies]
criterion = { version = "0.5", features = ["html_reports"] }
rayon = "1.10"

[[bench]]
name = "grass_scatter"
harness = false

[[bench]]
name = "grass_attribution"
harness = false

[[bench]]
name = "snapshot_write"
harness = false

[[bench]]
name = "tick_profile"
harness = false

[[bench]]
name = "grass_spread_repro"
harness = false

# wasm-pack release profile: run wasm-opt with bulk-memory + mutable-globals
# (required for wasm-bindgen-rayon's SharedArrayBuffer threading).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-mutable-globals"]
