[package]
name = "evosim"
version = "0.1.0"
edition = "2021"
description = "Browser-deployed idle evolution sandbox (Rust -> wasm)"
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

# Codegen binary: emits TS mirror of slider names + control SAB layout to
# `web/src/generated/`. Run `cargo run --bin gen-bindings` after modifying
# `SLIDER_NAMES` or `control_sab.rs`. A drift unit test catches mismatches.
[[bin]]
name = "gen-bindings"
path = "src/bin/gen_bindings.rs"

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
getrandom = { version = "0.2", features = ["js"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wide = "0.7"
rand_xoshiro = { version = "0.6", features = ["serde1"] }
twox-hash = { version = "2", default-features = false, features = ["xxhash64"] }

[dependencies.web-sys]
version = "0.3"
features = [
  "console",
  "Window",
  "Document",
  "Element",
  "HtmlCanvasElement",
  "CanvasRenderingContext2d",
  "Performance",
]

# wasm-bindgen-rayon is optional, behind feature flag (requires COOP/COEP + SAB).
# v1: ship without rayon by default; enable via feature when ready.
[features]
default = []
threads = ["wasm-bindgen-rayon", "rayon"]

[dependencies.wasm-bindgen-rayon]
version = "1.3"
optional = true

[dependencies.rayon]
version = "1.10"
optional = true

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 1
# panic=abort is required when building --features threads for wasm32.
# Without it, the dev profile defaults to panic=unwind, the linker silently
# emits non-shared WebAssembly.Memory, and wasm-bindgen-rayon's
# postMessage(memory) fails with DataCloneError at boot.
panic = "abort"

# wasm-pack release profile: run wasm-opt with bulk-memory + mutable-globals
# (required for wasm-bindgen-rayon's SharedArrayBuffer threading).
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-O4", "--enable-bulk-memory", "--enable-mutable-globals"]
