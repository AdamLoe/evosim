<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>evosim</title>
    <!-- COI service-worker shim: enables SharedArrayBuffer on hosts that
         can't set COOP/COEP response headers (e.g. GitHub Pages). On hosts
         that already serve the right headers (Vite dev, Cloudflare Pages
         via _headers) the shim is a no-op. Must run before any module
         script that touches SAB. -->
    <script src="/coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <!-- Left column: top-bar + canvas + optional profiler bottom panel. -->
      <div id="left-col">
        <!-- v1.13 Wave 1: top-bar is now an absolute-positioned overlay over
             the canvas area, hosting five icon buttons (play/pause, restart,
             auto-restart, settings, perf). The #status span is retained but
             unused — Wave 2 will remove it along with the status-update path
             in main.ts. -->
        <div id="top-bar">
        </div>

        <div id="canvas-wrap">
          <canvas id="aquarium"></canvas>
          <!-- v1.13 Wave 3: drag handle for the bottom profiler panel.
               Lives on the bottom edge of #canvas-wrap (which IS the top
               edge of #perf-box when the panel is shown). z-indexed above
               the canvas so pointer events don't reach camera pan/zoom.
               Hidden when #perf-box is display:none. -->
          <div id="perf-resize-handle" aria-hidden="true"></div>
        </div>

        <!-- Bottom monitor + profiler panel. Width follows the left column;
             height grows only when the panel is visible (display:none when
             off). v1.13 Wave 2: contents are built by widgets/perf-panel.ts
             — status line + graphs + selectors + CPU process monitor +
             profile trees. -->
        <div id="perf-box" class="perf-widget" style="display:none"></div>
      </div>

      <!-- Right rail: Inspector | NN | Settings -->
      <aside id="right-rail">
        <!-- v1.13 Wave 3: drag handle for the right rail width. Lives on the
             inner (left) edge of #right-rail. Hidden when the rail is
             collapsed (.rail-collapsed on #app-shell). -->
        <div id="rail-resize-handle" aria-hidden="true"></div>
        <nav id="rail-tabs" role="tablist">
          <button data-tab="inspector" class="rail-tab is-hidden">Inspector</button>
          <button data-tab="nn" class="rail-tab is-active">NN</button>
          <button data-tab="settings" class="rail-tab">Settings</button>
        </nav>

        <!-- Inspector tab: only present in the tab strip when a creature is
             selected (the tab button + this section get .is-hidden when
             nothing is selected). The existing #ins-* dl rows live inside
             this panel so the inspector module's getElementById calls keep
             working. -->
        <section id="rail-inspector" class="rail-panel">
          <div id="inspector-body">
            <dl>
              <dt>ID</dt><dd id="ins-id"></dd>
              <dt>Pos</dt><dd id="ins-pos"></dd>
              <dt>Action</dt><dd id="ins-action"></dd>
              <dt>Age</dt><dd id="ins-age"></dd>
              <dt>Energy</dt><dd id="ins-energy"></dd>
              <dt>Cooldown</dt><dd id="ins-cooldown">—</dd>
              <dt>EMA</dt><dd>
                <span id="ins-ema-swatch" class="ema-swatch"></span>
                <span id="ins-ema-values">—</span>
              </dd>
              <dt>Walls (N/S/E/W)</dt><dd id="ins-walls">—</dd>
              <dt>Recent</dt><dd id="ins-history">—</dd>
              <dt>NN weights</dt><dd id="ins-nn-count">—</dd>
            </dl>
          </div>
        </section>

        <!-- v1.12 NN tab: left = stage-then-apply topology editor (Apply
             respawns the worker), right = live-apply 8-bucket mutation
             policy editor, bottom = per-layer perf log. -->
        <section id="rail-nn" class="rail-panel is-active">
          <div id="nn-tab-host"></div>
        </section>

        <!-- Settings tab: dev panel content + Apply / Cancel / Reset footer. -->
        <section id="rail-settings" class="rail-panel">
          <div id="devpanel-box"></div>
          <div id="settings-footer">
            <button id="settings-apply" type="button" disabled>Apply</button>
            <button id="settings-cancel" type="button" disabled>Cancel</button>
            <button id="settings-reset" type="button">Reset</button>
          </div>
        </section>
      </aside>
    </div>

    <!-- Toast host for transient notifications (construction-only-changes,
         etc.). Pinned to the bottom-center of the viewport. -->
    <div id="toast-host"></div>

    <!-- World-end overlay: shown when the last creature dies. Grass keeps
         spreading underneath so the canvas fills in the background. -->
    <div id="world-end-overlay" hidden>
      <div class="world-end-card">
        <h2>World ended</h2>
        <p>The last creature has died. Grass is still spreading underneath.</p>
        <div class="world-end-actions">
          <button id="world-end-restart" type="button">Restart world</button>
          <button id="world-end-dismiss" type="button">Keep watching</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
