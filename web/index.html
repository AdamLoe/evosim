<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>evosim</title>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <canvas id="aquarium"></canvas>

    <div id="top-bar">
      <span id="status">booting…</span>
    </div>

    <!-- ui-stats: free-standing Stats widget, top-left, always visible. -->
    <div id="stats-box" class="overlay-widget">
      <canvas id="chart-pop" width="260" height="80"></canvas>
    </div>

    <!-- ui-inspector: Inspector pop-up. Hidden by default; shown by
         canvas click handler on creature hit. -->
    <div id="inspector-box" class="overlay-widget" style="display:none">
      <button id="inspector-close" type="button" aria-label="Close">×</button>
      <dl>
        <dt>ID</dt><dd id="ins-id"></dd>
        <dt>Pos</dt><dd id="ins-pos"></dd>
        <dt>Action</dt><dd id="ins-action"></dd>
        <dt>Age</dt><dd id="ins-age"></dd>
        <dt>Energy</dt><dd id="ins-energy"></dd>
        <dt>Cooldown</dt><dd id="ins-cooldown">—</dd>
        <dt>EMA</dt><dd>
          <span id="ins-ema-swatch" class="ema-swatch"></span>
          <span id="ins-ema-values">—</span>
        </dd>
        <dt>Walls (N/S/E/W)</dt><dd id="ins-walls">—</dd>
        <dt>Recent</dt><dd id="ins-history">—</dd>
        <dt>NN mut rate</dt><dd id="ins-nn-rate">—</dd>
        <dt>NN weights</dt><dd id="ins-nn-count">—</dd>
      </dl>
    </div>

    <!-- E.21: right rail shell -->
    <!-- v1.1: rail hidden via CSS (#right-rail { display: none; }) per
         master plan §8.1; DOM kept for future re-enable. Stats charts
         moved out into #stats-box (see ui-stats plan). -->
    <aside id="right-rail">
      <nav id="rail-tabs" role="tablist">
        <button data-tab="stats" class="rail-tab is-active">Stats</button>
        <!-- Inspector tab injected dynamically when a creature is selected -->
      </nav>

      <section id="rail-stats" class="rail-panel is-active">
      </section>
      <!-- Inspector content evicted to #inspector-box (ui-inspector). -->
      <section id="rail-inspector" class="rail-panel"></section>
    </aside>

    <!-- v1.5 settings overlay (right-edge, 320px). Toggle via ~ hotkey or
         ⚙ top-bar button. The dev panel lives inside this container. -->
    <aside id="settings-overlay" style="display:none">
      <button id="settings-close" type="button" aria-label="Close">×</button>
      <div id="devpanel-box"></div>
    </aside>

    <!-- ui-perf: free-standing perf widget (bottom-left, always visible) -->
    <div id="perf-box" class="overlay-widget perf-widget">
      <div class="perf-header-row">
        <label class="profiler-toggle">
          <input type="checkbox" id="profiler-enable" />
          profiler
        </label>
        <span id="perf-tps" class="perf-stat">— TPS</span>
        <span id="perf-jank" class="perf-stat">0 jank</span>
        <button id="jank-reset" class="jank-reset-btn" title="Reset jank counter">↺</button>
      </div>
      <!-- P3d: observability counters -->
      <div class="perf-obs-row">
        <span id="perf-grass-cells" class="perf-stat perf-obs">grass cells: —</span>
        <span id="perf-grass-total" class="perf-stat perf-obs">grass total: —</span>
      </div>
      <div id="profiler-stabilizing" class="profiler-stabilizing" style="display:none"></div>
      <!-- v1.7: four stacked tables (frame, tick, nn, grass_step) injected by perf-panel.ts -->
      <div id="profiler-trees"></div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
