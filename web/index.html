<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>evosim</title>
    <!-- COI service-worker shim: enables SharedArrayBuffer on hosts that
         can't set COOP/COEP response headers (e.g. GitHub Pages). On hosts
         that already serve the right headers (Vite dev, Cloudflare Pages
         via _headers) the shim is a no-op. Must run before any module
         script that touches SAB. -->
    <script src="/coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <div id="app-shell">
      <!-- Left column: top-bar + canvas + optional profiler bottom panel. -->
      <div id="left-col">
        <div id="top-bar">
          <span id="status">Booting…</span>
        </div>

        <div id="canvas-wrap">
          <canvas id="aquarium"></canvas>
          <!-- Floating profiler toggle — bottom-right of the canvas area.
               Always rendered; the .is-active class flips when the panel is
               open so the icon hints at the toggle state (no separate close
               button on the panel itself). -->
          <button id="perf-open" type="button" aria-label="Toggle profiler" title="Toggle profiler">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="none"
                 stroke="currentColor" stroke-width="1.6"
                 stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <rect x="2.5" y="3.5" width="19" height="13" rx="1.5"></rect>
              <path d="M8 20.5h8M12 16.5v4"></path>
              <path d="M5.5 13.5l3-3 2.5 2.5 3.5-5 3.5 3.5"></path>
            </svg>
          </button>
        </div>

        <!-- Profiler bottom panel. Width follows the left column; height
             grows only when the panel is visible (display:none when off). -->
        <div id="perf-box" class="perf-widget" style="display:none">
          <div class="perf-header-row">
            <span id="perf-tps" class="perf-stat">— TPS</span>
            <span id="perf-jank" class="perf-stat">0 jank</span>
            <label class="perf-window-label" for="perf-window-select" title="Profiler rolling-window length">
              window
              <select id="perf-window-select" class="perf-window-select">
                <option value="5000">5s</option>
                <option value="10000" selected>10s</option>
                <option value="30000">30s</option>
                <option value="60000">60s</option>
              </select>
            </label>
            <button id="jank-reset" class="jank-reset-btn" type="button" title="Reset profiler + jank" aria-label="Reset profiler + jank">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none"
                   stroke="currentColor" stroke-width="1.8"
                   stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <path d="M3 12a9 9 0 1 0 3-6.7"></path>
                <path d="M3 4v5h5"></path>
              </svg>
            </button>
          </div>
          <div class="perf-obs-row">
            <span id="perf-grass-cells" class="perf-stat perf-obs">grass cells: —</span>
            <span id="perf-grass-total" class="perf-stat perf-obs">grass total: —</span>
          </div>
          <div id="profiler-stabilizing" class="profiler-stabilizing" style="display:none"></div>
          <div id="profiler-trees"></div>
        </div>
      </div>

      <!-- Right rail: Inspector | Monitor | Settings -->
      <aside id="right-rail">
        <nav id="rail-tabs" role="tablist">
          <button data-tab="inspector" class="rail-tab is-active">Inspector</button>
          <button data-tab="monitor" class="rail-tab">Monitor</button>
          <button data-tab="nn" class="rail-tab">NN</button>
          <button data-tab="settings" class="rail-tab">Settings</button>
        </nav>

        <!-- Inspector tab: empty-state by default; populated on creature
             click. The existing #ins-* dl rows live inside this panel so
             the inspector module's getElementById calls keep working. -->
        <section id="rail-inspector" class="rail-panel is-active">
          <div id="inspector-empty" class="rail-empty">Click a creature to inspect.</div>
          <div id="inspector-body" style="display:none">
            <dl>
              <dt>ID</dt><dd id="ins-id"></dd>
              <dt>Pos</dt><dd id="ins-pos"></dd>
              <dt>Action</dt><dd id="ins-action"></dd>
              <dt>Age</dt><dd id="ins-age"></dd>
              <dt>Energy</dt><dd id="ins-energy"></dd>
              <dt>Cooldown</dt><dd id="ins-cooldown">—</dd>
              <dt>EMA</dt><dd>
                <span id="ins-ema-swatch" class="ema-swatch"></span>
                <span id="ins-ema-values">—</span>
              </dd>
              <dt>Walls (N/S/E/W)</dt><dd id="ins-walls">—</dd>
              <dt>Recent</dt><dd id="ins-history">—</dd>
              <dt>NN weights</dt><dd id="ins-nn-count">—</dd>
            </dl>
          </div>
        </section>

        <!-- Monitor tab: pop graph + worker/process stats. -->
        <section id="rail-monitor" class="rail-panel">
          <div class="rail-monitor-section">
            <div class="rail-section-title">Population</div>
            <canvas id="chart-pop" width="380" height="120"></canvas>
          </div>
          <div class="rail-monitor-section">
            <div class="rail-section-title">Process</div>
            <div id="worker-stats-host"></div>
          </div>
        </section>

        <!-- v1.12 NN tab: left = stage-then-apply topology editor (Apply
             respawns the worker), right = live-apply 8-bucket mutation
             policy editor, bottom = per-layer perf log. -->
        <section id="rail-nn" class="rail-panel">
          <div id="nn-tab-host"></div>
        </section>

        <!-- Settings tab: dev panel content + Apply / Cancel / Reset footer. -->
        <section id="rail-settings" class="rail-panel">
          <div id="devpanel-box"></div>
          <div id="settings-footer">
            <button id="settings-apply" type="button" disabled>Apply</button>
            <button id="settings-cancel" type="button" disabled>Cancel</button>
            <button id="settings-reset" type="button">Reset</button>
          </div>
        </section>
      </aside>
    </div>

    <!-- Toast host for transient notifications (construction-only-changes,
         etc.). Pinned to the bottom-center of the viewport. -->
    <div id="toast-host"></div>

    <!-- World-end overlay: shown when the last creature dies. Grass keeps
         spreading underneath so the canvas fills in the background. -->
    <div id="world-end-overlay" hidden>
      <div class="world-end-card">
        <h2>World ended</h2>
        <p>The last creature has died. Grass is still spreading underneath.</p>
        <div class="world-end-actions">
          <button id="world-end-restart" type="button">Restart world</button>
          <button id="world-end-dismiss" type="button">Keep watching</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
