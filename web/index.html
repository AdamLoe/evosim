<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="color-scheme" content="dark" />
    <title>evosim</title>
    <!-- COI service-worker shim: enables SharedArrayBuffer on hosts that
         can't set COOP/COEP response headers (e.g. GitHub Pages). On hosts
         that already serve the right headers (Vite dev, Cloudflare Pages
         via _headers) the shim is a no-op. Must run before any module
         script that touches SAB. -->
    <script src="/coi-serviceworker.min.js"></script>
    <link rel="stylesheet" href="/src/styles.css" />
  </head>
  <body>
    <!-- Default state: rail is collapsed (matches Settings.railOpen=false
         default). JS removes the class on boot iff the persisted setting
         says otherwise — avoids a one-frame flash of the rail-open layout
         on fresh loads while CSS is still applying. -->
    <div id="app-shell" class="rail-collapsed">
      <!-- Left column: top-bar + canvas + optional profiler bottom panel. -->
      <div id="left-col">
        <!-- v1.13 Wave 1: top-bar is now an absolute-positioned overlay over
             the canvas area, hosting five icon buttons (play/pause, restart,
             auto-restart, settings, perf). The #status span is retained but
             unused — Wave 2 will remove it along with the status-update path
             in main.ts. -->
        <div id="top-bar">
        </div>

        <div id="canvas-wrap">
          <canvas id="aquarium"></canvas>
          <!-- v2.0 Wave 1a: top-left status strip. Always visible (no dev
               panel needed): shows the numeric world_seed for the running
               world + a reroll button. Reroll picks a fresh seed and restarts;
               a plain restart reuses the displayed seed (same biome). -->
          <div id="status-strip" aria-live="polite">
            <span id="status-seed" title="Biome world seed">seed —</span>
            <button id="seed-reroll-btn" type="button" title="Reroll biome seed (new world)">⟳</button>
          </div>
          <!-- v1.13 Wave 3: drag handle for the bottom profiler panel.
               Lives on the bottom edge of #canvas-wrap (which IS the top
               edge of #perf-box when the panel is shown). z-indexed above
               the canvas so pointer events don't reach camera pan/zoom.
               Hidden when #perf-box is display:none. -->
          <div id="perf-resize-handle" aria-hidden="true"></div>
        </div>

        <!-- Bottom monitor + profiler panel. Width follows the left column;
             height grows only when the panel is visible (display:none when
             off). v1.13 Wave 2: contents are built by widgets/perf-panel.ts
             — status line + graphs + selectors + CPU process monitor +
             profile trees. -->
        <div id="perf-box" class="perf-widget" style="display:none"></div>
      </div>

      <!-- Right rail: Settings | NN | Inspector -->
      <aside id="right-rail">
        <!-- v1.13 Wave 3: drag handle for the right rail width. Lives on the
             inner (left) edge of #right-rail. Hidden when the rail is
             collapsed (.rail-collapsed on #app-shell). -->
        <div id="rail-resize-handle" aria-hidden="true"></div>
        <nav id="rail-tabs" role="tablist">
          <button data-tab="settings" class="rail-tab is-active" title="Settings" aria-label="Settings">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="12" cy="12" r="3"></circle>
              <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h0a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v0a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
            </svg>
          </button>
          <button data-tab="nn" class="rail-tab" title="Neural network" aria-label="Neural network">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9.5 3.5c-1.4 0-2.5 1.1-2.5 2.5 0 .3.05.6.14.86C6 7.3 5 8.5 5 10c0 .5.1 1 .3 1.4C4.5 12 4 13 4 14c0 1.4 1 2.6 2.3 2.9.1 1.2 1.1 2.1 2.4 2.1.4 0 .8-.1 1.1-.3.3 1.1 1.3 1.8 2.5 1.8.1-1.1 1.1-2 2.2-2 0-1.4-1.1-2.5-2.5-2.5"></path>
              <path d="M14.5 3.5c1.4 0 2.5 1.1 2.5 2.5 0 .3-.05.6-.14.86C18 7.3 19 8.5 19 10c0 .5-.1 1-.3 1.4.8.6 1.3 1.6 1.3 2.6 0 1.4-1 2.6-2.3 2.9-.1 1.2-1.1 2.1-2.4 2.1-.4 0-.8-.1-1.1-.3-.3 1.1-1.3 1.8-2.5 1.8V3.5c.7 0 1.4.3 1.8.8"></path>
              <path d="M12 4v17"></path>
            </svg>
          </button>
          <button data-tab="inspector" class="rail-tab" title="Inspector" aria-label="Inspector">
            <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <circle cx="11" cy="11" r="7"></circle>
              <path d="M21 21l-5-5"></path>
            </svg>
          </button>
        </nav>

        <!-- Settings tab: dev panel content + Apply / Cancel / Reset footer. -->
        <section id="rail-settings" class="rail-panel is-active">
          <div id="devpanel-box"></div>
          <div id="settings-footer">
            <button id="settings-apply" type="button" disabled>Apply</button>
            <button id="settings-cancel" type="button" disabled>Cancel</button>
            <button id="settings-reset" type="button">Reset</button>
          </div>
        </section>

        <!-- v1.12 NN tab: left = stage-then-apply topology editor (Apply
             respawns the worker), right = live-apply 8-bucket mutation
             policy editor, bottom = per-layer perf log. -->
        <section id="rail-nn" class="rail-panel">
          <div id="nn-tab-host"></div>
        </section>

        <!-- Inspector tab: empty-state hint by default; populated when the
             user clicks a creature on the canvas (only registers while the
             Inspector tab is the active one, see rail/inspector.ts). -->
        <section id="rail-inspector" class="rail-panel">
          <div id="inspector-empty" class="rail-empty">Waiting for creature to be clicked.</div>
          <div id="inspector-body" style="display:none">
            <dl>
              <dt>ID</dt><dd id="ins-id"></dd>
              <dt>Pos</dt><dd id="ins-pos"></dd>
              <dt>Action</dt><dd id="ins-action"></dd>
              <dt>Age</dt><dd id="ins-age"></dd>
              <dt>Energy</dt><dd id="ins-energy"></dd>
              <dt>Cooldown</dt><dd id="ins-cooldown">—</dd>
              <dt>Color</dt><dd>
                <span id="ins-color-swatch" class="ema-swatch"></span>
              </dd>
              <dt>Move penalty</dt><dd id="ins-move-penalty">—</dd>
            </dl>
            <!-- v2.0 Wave 2b: evolving body-genome traits (raw [0,1]). -->
            <div class="ins-genome-title">Genome</div>
            <dl id="ins-genome">
              <dt>Body size</dt><dd><span class="trait-bar"><span id="ins-trait-body_size" class="trait-fill"></span></span><span id="ins-trait-body_size-v" class="trait-val">—</span></dd>
              <dt>Max speed</dt><dd><span class="trait-bar"><span id="ins-trait-max_speed" class="trait-fill"></span></span><span id="ins-trait-max_speed-v" class="trait-val">—</span></dd>
              <dt>Metabolism</dt><dd><span class="trait-bar"><span id="ins-trait-metabolism" class="trait-fill"></span></span><span id="ins-trait-metabolism-v" class="trait-val">—</span></dd>
              <dt>Diet</dt><dd><span class="trait-bar"><span id="ins-trait-diet" class="trait-fill"></span></span><span id="ins-trait-diet-v" class="trait-val">—</span></dd>
              <dt>Water aff.</dt><dd><span class="trait-bar"><span id="ins-trait-water_affinity" class="trait-fill"></span></span><span id="ins-trait-water_affinity-v" class="trait-val">—</span></dd>
              <dt>Heat tol.</dt><dd><span class="trait-bar"><span id="ins-trait-heat_tolerance" class="trait-fill"></span></span><span id="ins-trait-heat_tolerance-v" class="trait-val">—</span></dd>
            </dl>
            <dl>
              <dt>Walls (N/S/E/W)</dt><dd id="ins-walls">—</dd>
              <dt>Recent</dt><dd id="ins-history">—</dd>
              <dt>NN weights</dt><dd id="ins-nn-count">—</dd>
            </dl>
          </div>
        </section>
      </aside>
    </div>

    <!-- Toast host for transient notifications (construction-only-changes,
         etc.). Pinned to the bottom-center of the viewport. -->
    <div id="toast-host"></div>

    <!-- World-end overlay: shown when the last creature dies. Grass keeps
         spreading underneath so the canvas fills in the background. -->
    <div id="world-end-overlay" hidden>
      <div class="world-end-card">
        <h2>World ended</h2>
        <p>The last creature has died.</p>
        <div class="world-end-actions">
          <button id="world-end-restart" type="button">Restart world</button>
          <button id="world-end-dismiss" type="button">Keep watching</button>
        </div>
      </div>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
